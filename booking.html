<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book an Event | Taste of Alanda</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;

            background:
            linear-gradient(rgba(0,0,0,0.75),
            rgba(0,0,0,0.75)),
            url('chef-homepage.png');

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            color: white;
        }

        nav {
            background-color: rgba(0,0,0,0.9);
            padding: 18px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .booking-container {
            background-color: white;
            color: black;
            max-width: 700px;
            margin: 60px auto;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0px 8px 25px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
        }

        input, textarea, select {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            margin-bottom: 25px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #333;
        }

    </style>

</head>

<body>

   <nav>
    <a href="index.html">Home</a>
    <a href="gallery.html">Testimonials & Gallery</a>
    <a href="contact.html">Contact</a>
    <a href="pricing.html">Pricing & Packages</a>
    <a href="booking.html">Book Now</a>
</nav>

    <div class="booking-container">

        <h1>Book Your Event</h1>

        <form>

            <label>Full Name</label>
            <input type="text" placeholder="Enter your name">

            <label>Email Address</label>
            <input type="email" placeholder="Enter your email">

            <label>Phone Number</label>
            <input type="tel" placeholder="Enter your phone number">

            <label>Select Package</label>

            <select>
                <option>Basic Package</option>
                <option>Premium Package</option>
                <option>Deluxe Package</option>
            </select>

            <label>Event Details</label>

            <textarea rows="6"
            placeholder="Describe your event..."></textarea>

            <button type="submit">
                Submit Booking Request
            </button>

        </form>

    </div>

</body>

</html>
